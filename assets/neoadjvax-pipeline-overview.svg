<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2010" viewBox="0 0 1600 2010" role="img" aria-labelledby="title desc">
<title id="title">NeoadjVax workflow map</title>
<desc id="desc">Metromap of nine Nextflow branches. DNA and RNA variant calling feed RNA-support filtering, VEP and pVACseq, with HLA alleles supplied separately. RNA can be from any timepoint. The splicing route combines DNA WES/WGS SpliceAI predictions and RNA LeafCutter junction evidence in splice2neo, excludes GENCODE and normal-panel junctions, and generates CDS/ORF peptide contexts without HLA ranking. Fusion calling runs end to end through AGFusion annotation and pVACfuse binding prediction; only the RNA ERV peptide stage remains unfinished. ERVcaller produces separate DNA insertion evidence for tumour and normal. Sequenza purity and ploidy can feed SpecHLA HLA-LOH analysis. Repeated input stations denote the same input types, not dependencies between lanes.</desc>
<style>
:root {
  --bg: #ffffff;
  --ink: #20303d;
  --heading: #b45309;
  --muted: #b93f35;
  --todo: #b93f35;
  --divider: #dbe2e7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117;
    --ink: #e6edf3;
    --heading: #fb923c;
    --muted: #f87171;
    --todo: #f87171;
    --divider: #30363d;
  }
}
text {font-family:Arial,Helvetica,sans-serif;fill:var(--heading)}
.title {font-size:38px;font-weight:700}
.subtitle {font-size:20px;fill:var(--muted)}
.section {font-size:18px;font-weight:700;letter-spacing:1.5px}
.label {font-size:22px;font-weight:600}
.note {font-size:18px;fill:var(--muted)}
.small {font-size:17px;fill:var(--muted)}
.todo {font-size:17px;fill:var(--todo)}
.track {fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.station {fill:var(--bg);stroke:var(--ink);stroke-width:3}
.pending {stroke-dasharray:10 12}
.divider {stroke:var(--divider);stroke-width:1.5}
.ink-fill {fill:var(--ink)}
.ink-stroke {stroke:var(--ink)}
</style>
<!-- Transparent canvas; station fills remain theme-aware to mask the tracks. -->
