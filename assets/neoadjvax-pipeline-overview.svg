<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1810" viewBox="0 0 1600 1810" role="img" aria-labelledby="title desc">
<title id="title">NeoadjVax workflow map</title>
<desc id="desc">Metromap of nine Nextflow branches. DNA and RNA variant calling feed RNA-support filtering, VEP and pVACseq, with HLA alleles supplied separately. RNA can be from any timepoint. Optional fusion, splicing and RNA ERV routes have unfinished peptide stages. ERVcaller produces separate DNA insertion evidence for tumour and normal. Sequenza purity and ploidy can feed SpecHLA HLA-LOH analysis. Repeated input stations denote the same input types, not dependencies between lanes.</desc>
<style>
text {font-family:Arial,Helvetica,sans-serif;fill:#20303d}
.title {font-size:38px;font-weight:700}
.subtitle {font-size:20px;fill:#566774}
.section {font-size:18px;font-weight:700;letter-spacing:1.5px}
.label {font-size:22px;font-weight:600}
.note {font-size:18px;fill:#566774}
.small {font-size:17px;fill:#566774}
.todo {font-size:17px;fill:#8b5143}
.track {fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.station {fill:white;stroke:#20303d;stroke-width:3}
.pending {stroke-dasharray:10 12}
</style>
<rect width="1600" height="1810" fill="white"/>
<text x="70" y="65" class="title" text-anchor="start">NeoadjVax workflow map</text>
<text x="70" y="101" class="subtitle" text-anchor="start">Nextflow DSL2 / melanoma neoantigen discovery</text>
<text x="1530" y="65" class="small" text-anchor="end">READ LEFT TO RIGHT</text>
<text x="1530" y="96" class="subtitle" text-anchor="end">RNA-seq from any timepoint</text>
