<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1730" viewBox="0 0 1800 1730" role="img" aria-labelledby="title desc">
<title id="title">NeoadjVax somatic pipeline map</title>
<desc id="desc">Metro map of the somatic neoantigen pipeline. Tumour and normal DNA (FASTQ or aligned BAM) go through QC, trimming, BWA-MEM, duplicate marking and BQSR, then Mutect2 with orientation and contamination filtering to a PASS somatic VCF. That VCF feeds three lines that meet at pVACseq: VEP, bam-readcount on the DNA and optional baseline and week 6 RNA BAMs, and vcf-readcount-annotator; germline calling around somatic sites and WhatsHap phasing for the proximal-variant VCF; and HLA-HD typing of the normal. Sequenza purity from the samplesheet goes to pVACseq, and ploidy and segment copy number to the CCF table, which also carries the week 6 RNA counts. A separate optional fusion section takes baseline RNA FASTQ through STAR-Fusion, or an existing STAR-Fusion table, then AGFusion and pVACfuse, into the patient report. The pVACseq and CCF reports also flow directly into that melanoma report, with HLA and clinical values, RNA support per timepoint from the readcount VCFs, and optional expression context from featureCounts TPM with GTEx and TCGA tables and a gene panel. The LaTeX report is compiled to PDF with pdflatex. Dashed lines are optional. Repeated input stations denote the same input, not separate dependencies.</desc>
<style>
:root {
  --bg: #ffffff;
  --ink: #20303d;
  --heading: #20303d;
  --muted: #5b6b7a;
  --divider: #dbe2e7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117;
    --ink: #e6edf3;
    --heading: #e6edf3;
    --muted: #9aa7b4;
    --divider: #30363d;
  }
}
text {font-family:Arial,Helvetica,sans-serif;fill:var(--heading)}
.title {font-size:38px;font-weight:700}
.subtitle {font-size:20px;fill:var(--muted)}
.section {font-size:18px;font-weight:700;letter-spacing:1.5px}
.label {font-size:20px;font-weight:600}
.note {font-size:16px;fill:var(--muted)}
.small {font-size:17px;fill:var(--muted)}
.track {fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.station {fill:var(--bg);stroke:var(--ink);stroke-width:3}
.optional {stroke-dasharray:10 12}
.report-track {stroke:var(--ink)}
.divider {stroke:var(--divider);stroke-width:1.5}
</style>
