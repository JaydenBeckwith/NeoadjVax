# CI for structure and style, not biology: no real reference data,
# containers or Gadi access exist here. The stub-run job is the one that
# actually exercises Nextflow itself (with docker/singularity disabled and
# every process's placeholder `stub:` block), which neither the cloud
# sandbox nor this repo's own dev machine could do when this workflow was
# written (both lack the network access to install Nextflow); GitHub's
# runners have no such restriction, so this is the first place these
# branches get a real Nextflow run rather than a hand-rolled static check.
# The stub-run matrix is discovered from tests/*/smoke.nf at run time, so a
# new branch's smoke test is picked up automatically, no edit needed here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s tests -v

  nf-structure:
    name: .nf structural check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 bin/check_nf_structure.py .


  discover-smoke-tests:
    name: Discover smoke tests
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.find.outputs.branches }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          branches=$(for d in tests/*/; do
            b="$(basename "$d")"
            if [ -f "tests/$b/smoke.nf" ] && [ -f "tests/$b/smoke.config" ]; then
              echo "$b"
            fi
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "branches=$branches" >> "$GITHUB_OUTPUT"
          echo "Found smoke tests: $branches"

  stub-run:
    name: nextflow -stub-run (${{ matrix.branch }})
    needs: discover-smoke-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover-smoke-tests.outputs.branches) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Nextflow
        # Pinned: get.nextflow.io installs whatever is currently latest,
        # and that mattered here (an older run against a newer Nextflow
        # surfaced two real strict-syntax parse breaks in this repo's own
        # .nf files, since fixed). Pinning keeps a future Nextflow release
        # from silently breaking this workflow again the same way.
        run: |
          export NXF_VER=26.04.6
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version
      - name: Run smoke test
        run: |
          nextflow -c "tests/${{ matrix.branch }}/smoke.config" \
                    run "tests/${{ matrix.branch }}/smoke.nf" -stub-run

  stub-run-splicing:
    # Splicing doesn't use the smoke.nf convention the other branches do
    # (see tests/splicing/): it runs main.nf itself against a generated
    # params.json, per the exact commands in docs/SPLICING.md. Kept as its
    # own job rather than folded into the discovered matrix above.
    name: nextflow -stub-run (splicing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Nextflow
        # Pinned: get.nextflow.io installs whatever is currently latest,
        # and that mattered here (an older run against a newer Nextflow
        # surfaced two real strict-syntax parse breaks in this repo's own
        # .nf files, since fixed). Pinning keeps a future Nextflow release
        # from silently breaking this workflow again the same way.
        run: |
          export NXF_VER=26.04.6
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version
      - name: Generate fixture and sanity-check the input adapters
        run: |
          python3 tests/splicing/make_fixture.py /tmp/neoadjvax-splicing
          python3 bin/prepare_splicing_inputs.py spliceai \
            --input /tmp/neoadjvax-splicing/dna.spliceai.vcf \
            --output /tmp/neoadjvax-splicing/effects.tsv --qc /tmp/neoadjvax-splicing/qc.json
          python3 bin/prepare_splicing_inputs.py leafcutter \
            --input /tmp/neoadjvax-splicing/cohort_perind.counts.gz --sample P1_day0 \
            --output /tmp/neoadjvax-splicing/selected.gz --evidence /tmp/neoadjvax-splicing/evidence.tsv
      - name: Run smoke test
        run: |
          nextflow run main.nf -c tests/splicing/stub.config \
            -params-file /tmp/neoadjvax-splicing/params.json -stub-run
