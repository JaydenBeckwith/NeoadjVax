# CI for structure and style, not biology: no real reference data,
# containers or Gadi access exist here. The stub-run job is the one that
# actually exercises Nextflow itself (with docker/singularity disabled and
# every process's placeholder `stub:` block), which neither the cloud
# sandbox nor this repo's own dev machine could do when this workflow was
# written (both lack the network access to install Nextflow); GitHub's
# runners have no such restriction, so this is the first place these
# branches get a real Nextflow run rather than a hand-rolled static check.
#
# The erv_dna/fusion/splicing stub-run jobs that used to live here were
# removed: the "somatic_neoantigen" pipeline (DNA + RNA variant calling +
# pVACseq core) below is the most mature, most original-script-ported part
# of NeoadjVax, so it's the one kept running in CI for now.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s tests -v

  nf-structure:
    name: .nf structural check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 bin/check_nf_structure.py .


  stub-run-dna-somatic:
    # Runs main.nf itself (not a standalone smoke.nf) with --pipelines
    # somatic_neoantigen: DNA_VARIANT_CALLING + RNA_VARIANT_CALLING +
    # PVACSEQ_CORE together, the same way a real invocation would. See
    # tests/dna_somatic/smoke.config for why P1's inputs are shaped the
    # way they are (already-aligned BAMs, rna_skip_realignment, a manual
    # hla_alleles override) and assets/samplesheet_schema.md for the
    # samplesheet formats.
    name: nextflow -stub-run (dna_somatic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Nextflow
        # Pinned: get.nextflow.io installs whatever is currently latest,
        # and that mattered here (an older run against a newer Nextflow
        # surfaced two real strict-syntax parse breaks in this repo's own
        # .nf files, since fixed). Pinning keeps a future Nextflow release
        # from silently breaking this workflow again the same way.
        run: |
          export NXF_VER=26.04.6
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version
      - name: Run smoke test
        run: |
          nextflow -c tests/dna_somatic/smoke.config run main.nf -stub-run
