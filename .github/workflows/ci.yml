# Synthetic BAMs are real/validated; analysis tools are stubbed intentionally.
# This checks main.nf wiring and all patient/timepoint outputs, not accuracy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit tests and Nextflow structure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check Nextflow structure
        run: python bin/check_nf_structure.py .

  somatic-wiring:
    name: Somatic pipeline — synthetic BAM wiring test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NXF_VER: '26.04.6'
      NXF_ANSI_LOG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install samtools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends samtools
          samtools --version
      - name: Install pinned Nextflow
        run: |
          curl --fail --silent --show-error --location https://get.nextflow.io -o nextflow
          sudo install -m 755 nextflow /usr/local/bin/nextflow
          nextflow -version
      - name: Generate and validate synthetic DNA/RNA BAMs
        run: python tests/dna_somatic/make_fixture.py --outdir tests/dna_somatic/generated
      - name: Run the real entry workflow with stubbed analysis tools
        run: |
          nextflow -c tests/dna_somatic/smoke.config run main.nf \
            --pipelines somatic_neoantigen -stub-run \
            -work-dir test-work/dna_somatic
      - name: Assert every patient and RNA timepoint reaches pVACseq
        run: |
          python tests/dna_somatic/check_results.py \
            --manifest tests/dna_somatic/generated/manifest.json \
            --trace test-results/dna_somatic/trace.tsv \
            --outdir test-results/dna_somatic
      - name: Upload fixture, results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somatic-wiring-diagnostics
          include-hidden-files: true
          retention-days: 7
          path: |
            .nextflow.log*
            tests/dna_somatic/generated/
            test-results/dna_somatic/
            test-work/dna_somatic/**/.command.*
